name: Codex Pages Cross Repository Probe
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
  actions: read
jobs:
  cross-repository:
    runs-on: ubuntu-latest
    steps:
      - name: Attempt repository B Pages creation using repository A token
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          response_file=$(mktemp)
          status=$(curl -sS -o "$response_file" -w '%{http_code}' \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/michael1026/h1-codex-dependency-b-20261113/pages \
            -d '{"build_type":"workflow"}')
          message=$(jq -r '.message // "none"' "$response_file")
          echo "cross_create_status=$status"
          echo "cross_create_message=$message"
          if [ "$status" = "201" ]; then
            echo 'unexpected_cross_repository_write=true'
          else
            echo 'unexpected_cross_repository_write=false'
          fi