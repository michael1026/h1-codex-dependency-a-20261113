name: Codex deployment token boundary
on:
  workflow_dispatch:
permissions:
  contents: read
  deployments: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Exercise local and cross-repository deployment boundaries
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_A: ${{ github.repository }}
          REPO_B: michael1026/h1-codex-dependency-b-20261113
          B_SHA: 96ae26f5c49f64bbb120cf9aabfda0c305134f28
          B_DEPLOYMENT_ID: 7782844395
        run: |
          api='https://api.github.com'
          headers=(-H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' -H "Authorization: Bearer $GH_TOKEN")
          local_body=$(jq -nc --arg ref "$GITHUB_SHA" '{ref:$ref,auto_merge:false,environment:"codex-actions-local",task:"deploy:codex-controlled",description:"Controlled repository-local Actions token deployment"}')
          local_code=$(curl -sS -o local.json -w '%{http_code}' -X POST "${headers[@]}" "$api/repos/$REPO_A/deployments" -d "$local_body")
          local_id=$(jq -r '.id // "none"' local.json)
          local_status_code='not-run'
          if [ "$local_code" = '201' ]; then
            local_status_code=$(curl -sS -o local-status.json -w '%{http_code}' -X POST "${headers[@]}" "$api/repos/$REPO_A/deployments/$local_id/statuses" -d '{"state":"success","auto_inactive":false,"description":"Controlled Actions token local success"}')
          fi
          cross_status_code=$(curl -sS -o cross-status.json -w '%{http_code}' -X POST "${headers[@]}" "$api/repos/$REPO_B/deployments/$B_DEPLOYMENT_ID/statuses" -d '{"state":"success","auto_inactive":false,"description":"Controlled cross-repository denial probe"}')
          cross_body=$(jq -nc --arg ref "$B_SHA" '{ref:$ref,auto_merge:false,environment:"codex-actions-cross",task:"deploy:codex-controlled",description:"Controlled cross-repository denial probe"}')
          cross_create_code=$(curl -sS -o cross-create.json -w '%{http_code}' -X POST "${headers[@]}" "$api/repos/$REPO_B/deployments" -d "$cross_body")
          printf 'local_create=%s local_status=%s local_id=%s cross_status=%s cross_create=%s\n' "$local_code" "$local_status_code" "$local_id" "$cross_status_code" "$cross_create_code"
