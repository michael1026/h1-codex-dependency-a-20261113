name: Codex Pages Cross Repository Cancel Probe
on:
  workflow_dispatch:
    inputs:
      deployment_id:
        description: Controlled repository B deployment id
        required: true
        type: string
permissions:
  contents: read
  pages: write
jobs:
  cross-cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Attempt cancellation through authorized repository A route
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FOREIGN_DEPLOYMENT_ID: ${{ inputs.deployment_id }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            response=$(mktemp)
            status=$(curl -sS -o "$response" -w '%{http_code}' -X POST \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/michael1026/h1-codex-dependency-a-20261113/pages/deployments/$FOREIGN_DEPLOYMENT_ID/cancel")
            message=$(jq -r '.message // "none"' "$response")
            echo "cancel_attempt_${attempt}_http=$status message=$message"
            if [ "$status" != '404' ]; then
              break
            fi
            sleep 1
          done