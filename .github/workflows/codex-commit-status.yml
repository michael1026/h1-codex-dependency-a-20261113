name: Codex controlled commit status
on:
  workflow_dispatch:
    inputs:
      sha:
        required: true
        type: string
      context:
        required: true
        type: string
      state:
        required: true
        type: choice
        options:
          - success
          - pending
          - failure
permissions:
  contents: read
  statuses: write
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Create controlled commit status
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ inputs.sha }}
          STATUS_CONTEXT: ${{ inputs.context }}
          STATUS_STATE: ${{ inputs.state }}
        run: |
          body=$(jq -nc --arg state "$STATUS_STATE" --arg context "$STATUS_CONTEXT" '{state:$state,context:$context,description:"Controlled Actions app status"}')
          code=$(curl -sS -o response.json -w '%{http_code}' -X POST -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/${{ github.repository }}/statuses/$TARGET_SHA" -d "$body")
          status_id=$(jq -r '.id // "none"' response.json)
          printf 'status_create=%s status_id=%s context=%s state=%s\n' "$code" "$status_id" "$STATUS_CONTEXT" "$STATUS_STATE"
